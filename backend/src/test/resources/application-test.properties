# A fresh in-memory database per Spring context, so contexts never share data.
spring.datasource.url=jdbc:h2:mem:qb-test-${random.uuid};DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
# Jobs run instantly and the poller reacts fast.
queueboard.simulation.delay-scale=0
queueboard.worker.poll-interval-ms=50
logging.level.com.liberty.queueboardbe=WARN
