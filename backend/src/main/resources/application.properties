spring.application.name=QueueBoard
server.port=8080

# H2 in-memory; Flyway owns the schema, Hibernate only validates it.
# LOCK_TIMEOUT lets two jobs touching the same rows wait for each other instead of failing fast.
spring.datasource.url=jdbc:h2:mem:queueboard;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Timestamps as ISO-8601 in UTC
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# QueueBoard
queueboard.worker.enabled=true
queueboard.worker.threads=5
queueboard.worker.poll-interval-ms=500
queueboard.jobs.max-attempts=3
queueboard.demo.enabled=true
queueboard.simulation.delay-scale=1.0

# Logging: INFO shows the job lifecycle (submit, start, finish, fail, retry, delete);
# DEBUG (dev profile) adds claims, handler steps and rejected requests.
# Lines written while a job runs carry [job <id>]; other lines have no tag.
logging.level.com.liberty.queueboardbe=INFO
logging.pattern.level=%5p%replace( [job %X{jobId}]){' \\[job \\]', ''}
