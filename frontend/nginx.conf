server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Resolving per request (via the variable below) lets nginx
  # start before the backend is up and survive backend restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8080;

  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Same-origin from the browser's point of view: drop Origin so the backend's
    # CORS allowlist (dev ports only) doesn't reject POST/DELETE.
    proxy_set_header Origin "";
    proxy_read_timeout 30s;
  }

  # Swagger UI and the OpenAPI spec. ^~ stops the asset regex below from catching
  # Swagger's own .js/.css/.png files. $http_host keeps the port (localhost:8080) so
  # springdoc's redirect and its "servers" URL point back to this address.
  location ^~ /swagger-ui {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /v3/api-docs {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets can be cached forever.
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA routes (/dashboard, /jobs/:id) fall back to index.html, which is never cached.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
